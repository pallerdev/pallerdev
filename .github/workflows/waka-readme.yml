name: Update WakaTime stats

on:
  schedule:
    - cron: "0 6 * * *" # todos los días a las 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render WakaTime section
        env:
          # URLs públicas de "share" (wakatime.com/share/embed), no son secretos
          WAKA_LANGUAGES_URL: https://wakatime.com/share/@018f0018-0fc8-45dc-9294-14f7c26e48d9/b3df703d-91c0-4c6f-bcec-cc963643a6f0.json
          WAKA_CATEGORIES_URL: https://wakatime.com/share/@018f0018-0fc8-45dc-9294-14f7c26e48d9/c4b46874-ebf8-40c6-afa1-ed91a25027c0.json
        run: python3 .github/scripts/update_waka.py

      - name: Commit changes
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(waka): update stats" README.md
          git push
